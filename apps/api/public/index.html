<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auto-x Admin</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --fg:#e7ecf3; --mut:#8b9bb4; --acc:#1d9bf0; --ok:#00ba7c; --bad:#f4212e; --warn:#ffad1f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:1rem 1.25rem; border-bottom:1px solid #243044; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    h1 { font-size:1.1rem; margin:0; }
    main { padding:1rem 1.25rem; display:grid; gap:1rem; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); }
    .card { background:var(--card); border-radius:12px; padding:1rem; }
    .card h2 { margin:0 0 .75rem; font-size:.95rem; color:var(--mut); font-weight:600; }
    button, input { font: inherit; }
    button { background:var(--acc); color:#fff; border:0; border-radius:999px; padding:.5rem 1rem; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.secondary { background:#2f3b4f; }
    input { background:#0b1017; border:1px solid #2f3b4f; color:var(--fg); border-radius:8px; padding:.5rem .7rem; width: min(320px,100%); }
    table { width:100%; border-collapse: collapse; font-size:.85rem; }
    th, td { text-align:left; padding:.35rem .25rem; border-bottom:1px solid #243044; }
    .tag { display:inline-block; padding:.15rem .45rem; border-radius:6px; background:#243044; font-size:.75rem; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    #login { max-width:420px; margin:10vh auto; padding:1.5rem; background:var(--card); border-radius:16px; }
    #app { display:none; }
    #log { font-family: ui-monospace, monospace; font-size:.75rem; max-height:240px; overflow:auto; white-space:pre-wrap; color:var(--mut); }
    .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    #toast { position:fixed; right:1rem; bottom:1rem; max-width:360px; padding:.75rem 1rem; border-radius:10px; background:#243044; color:var(--fg); display:none; z-index:99; box-shadow:0 8px 24px #0008; }
    #toast.err { background:#3d1519; border:1px solid var(--bad); }
    #toast.ok { background:#0f2e22; border:1px solid var(--ok); }
    #busy { display:none; font-size:.8rem; color:var(--warn); }
  </style>
</head>
<body>
  <div id="login">
    <h1>auto-x 管理端</h1>
    <p style="color:var(--mut);font-size:.9rem">输入 ADMIN_TOKEN（.env 中配置，仅内存保存）</p>
    <div class="row" style="margin-top:1rem">
      <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" />
      <button type="button" id="btnLogin">登录</button>
    </div>
    <p id="loginErr" class="bad" style="min-height:1.2rem"></p>
  </div>

  <div id="app">
    <header>
      <h1>auto-x</h1>
      <span id="me" class="tag">—</span>
      <span id="mode" class="tag">mode: …</span>
      <span id="wsState" class="tag">ws: …</span>
      <span id="busy">处理中…</span>
      <div class="row" style="margin-left:auto">
        <button type="button" id="btnProbe" class="secondary">探测 X API</button>
        <button type="button" id="btnStart">启动自动化</button>
        <button type="button" id="btnStop" class="secondary">停止</button>
        <button type="button" id="btnSync" class="secondary">立即同步</button>
        <button type="button" id="btnRefresh" class="secondary">刷新</button>
      </div>
    </header>
    <main>
      <section class="card">
        <h2>统计</h2>
        <div id="stats">—</div>
      </section>
      <section class="card">
        <h2>运行时 / 能力</h2>
        <div id="runtime">—</div>
      </section>
      <section class="card">
        <h2>X 限流与计划重试</h2>
        <div id="rates" style="font-size:.85rem">—</div>
      </section>
      <section class="card" style="grid-column:1/-1">
        <h2>任务队列</h2>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>ID</th><th>类型</th><th>状态</th><th>用户</th><th>来源</th></tr></thead>
            <tbody id="jobs"></tbody>
          </table>
        </div>
      </section>
      <section class="card">
        <h2>粉丝</h2>
        <div id="followers">—</div>
      </section>
      <section class="card">
        <h2>关注中</h2>
        <div id="following">—</div>
      </section>
      <section class="card" style="grid-column:1/-1">
        <h2>实时日志</h2>
        <div id="log"></div>
      </section>
    </main>
  </div>
  <div id="toast"></div>
<script>
(function () {
  let token = '';
  let ws = null;
  let refreshing = false;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = kind === 'err' ? 'err' : kind === 'ok' ? 'ok' : '';
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function setBusy(on, label) {
    busy = on;
    $('busy').style.display = on ? 'inline' : 'none';
    $('busy').textContent = label || '处理中…';
    ['btnProbe','btnStart','btnStop','btnSync','btnRefresh','btnLogin'].forEach((id) => {
      const b = $(id);
      if (b) b.disabled = on && id !== 'btnLogin' ? true : false;
    });
    if ($('btnLogin')) $('btnLogin').disabled = on;
  }

  function log(line) {
    const el = $('log');
    if (!el) return;
    el.textContent = new Date().toISOString().slice(11, 19) + ' ' + line + '\n' + el.textContent;
  }

  function authHeaders() {
    return { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  async function api(path, opts = {}) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opts.timeoutMs || 60000);
    try {
      const r = await fetch(path, {
        method: opts.method || 'GET',
        headers: { ...authHeaders(), ...(opts.headers || {}) },
        body: opts.body,
        signal: ctrl.signal,
      });
      const text = await r.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if (!r.ok) {
        const msg = (data && (data.error || data.message)) || (path + ' HTTP ' + r.status);
        throw new Error(msg);
      }
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  async function withAction(label, fn) {
    if (busy) {
      toast('请等待上一个操作完成', 'err');
      return;
    }
    setBusy(true, label);
    log(label + '…');
    try {
      await fn();
      toast(label + ' 完成', 'ok');
      log(label + ' OK');
    } catch (e) {
      const msg = e && e.name === 'AbortError' ? '请求超时' : (e.message || String(e));
      toast(label + ' 失败: ' + msg, 'err');
      log(label + ' FAIL ' + msg);
    } finally {
      setBusy(false);
    }
  }

  async function refresh() {
    if (refreshing) return;
    refreshing = true;
    try {
      const me = await api('/api/v1/me', { timeoutMs: 15000 });
      const cap = await api('/api/v1/capabilities', { timeoutMs: 10000 });
      $('mode').textContent =
        'mode: ' + cap.mode + (cap.credentialsConfigured ? ' · keys ok' : ' · NO KEYS');
      $('mode').className = 'tag ' + (cap.mode === 'live' ? 'ok' : 'bad');

      const liveUser = (cap.capabilities && cap.capabilities.meUser) || null;
      if (me.account) {
        $('me').textContent = '@' + me.account.username + ' (' + me.account.id + ')';
      } else if (liveUser) {
        $('me').textContent = '@' + liveUser.username + ' (待 bootstrap)';
      } else {
        $('me').textContent = '未绑定账号 — 点「探测 X API」';
      }

      const c = cap.capabilities || me.runtime?.capabilities || {};
      const errFollow = (c.errors && (c.errors.readFollowers || c.errors.readFollowing)) || '';
      $('runtime').innerHTML =
        '<div>automation: <b class="' + (me.runtime?.automation_enabled ? 'ok' : 'bad') + '">' +
        !!me.runtime?.automation_enabled + '</b></div>' +
        '<div>graph_consistent: ' + !!me.runtime?.graph_consistent + '</div>' +
        '<div>getMe: <span class="' + (c.me ? 'ok' : 'bad') + '">' + !!c.me + '</span> · ' +
        'followers列表: <span class="' + (c.readFollowers ? 'ok' : 'warn') + '">' + !!c.readFollowers + '</span> · ' +
        'following列表: <span class="' + (c.readFollowing ? 'ok' : 'warn') + '">' + !!c.readFollowing + '</span> · ' +
        'write: <span class="' + (c.writeFollow ? 'ok' : 'bad') + '">' + !!c.writeFollow + '</span></div>' +
        (errFollow ? '<div class="warn">列表权限: ' + errFollow + '</div>' : '') +
        '<div>last_error: ' + (me.runtime?.last_error || '—') + '</div>';

      try {
        const st = await api('/api/v1/stats', { timeoutMs: 10000 });
        $('stats').innerHTML = st.empty ? '无账号' :
          '粉丝 ' + st.followers + ' · 关注 ' + st.following + ' · 观察 ' + st.watching +
          '<br/>今日 follow ' + st.dailyFollows + ' / unfollow ' + st.dailyUnfollows +
          '<br/>jobs ' + JSON.stringify(st.jobs || {});
      } catch (e) {
        $('stats').textContent = 'stats 失败: ' + e.message;
      }

      try {
        const rl = await api('/api/v1/rate-limits', { timeoutMs: 10000 });
        const sch = rl.schedule || {};
        const budgets = rl.budgets || [];
        let html = '';
        if (sch.nextRetryInSec > 0) {
          html += '<div class="warn"><b>计划重试</b> ' + sch.nextRetryInSec + 's' +
            (sch.nextRetryBucket ? '（' + sch.nextRetryBucket + '）' : '') +
            '<br/><span style="font-size:.75rem;color:var(--mut)">' + (sch.nextRetryAt || '') + '</span></div>';
        } else {
          html += '<div class="ok">当前无等待</div>';
        }
        if (sch.lastEvent) html += '<div>最近: ' + sch.lastEvent + '</div>';
        if (rl.progress) {
          html += '<div>同步: ' + (rl.progress.stream || '') + ' · ' + (rl.progress.phase || '') +
            ' · 页 ' + (rl.progress.pagesDone || 0) +
            (rl.progress.error ? ' · <span class="bad">' + rl.progress.error + '</span>' : '') + '</div>';
        }
        if (budgets.length) {
          html += '<table><thead><tr><th>桶</th><th>状态</th><th>剩余</th><th>下次</th></tr></thead><tbody>';
          budgets.forEach((b) => {
            html += '<tr><td>' + b.bucket + '</td><td>' + (b.status || '') + '</td><td>' +
              b.remaining + '/' + b.limit + '</td><td>' +
              (b.nextAllowedInSec > 0 ? b.nextAllowedInSec + 's' : '现在') + '</td></tr>';
          });
          html += '</tbody></table>';
        }
        if (rl.lastError) html += '<div class="bad">' + rl.lastError + '</div>';
        $('rates').innerHTML = html || '—';
      } catch (e) {
        $('rates').textContent = 'rate-limits: ' + e.message;
      }

      try {
        const jobs = await api('/api/v1/jobs?limit=40', { timeoutMs: 10000 });
        $('jobs').innerHTML = (jobs.jobs || []).map((j) => {
          const retry = j.retryInSec > 0 ? '<br/><span class="warn">重试 ' + j.retryInSec + 's</span>' : '';
          const err = j.lastError ? '<br/><span class="bad">' + j.lastError + '</span>' : '';
          return '<tr><td>' + j.id + '</td><td>' + j.type + '</td><td><span class="tag">' + j.status +
            '</span>' + retry + err + '</td><td>' + (j.username ? '@' + j.username : '@?') +
            ' ' + (j.name || '') + '</td><td>' + (j.source || '') + '</td></tr>';
        }).join('') || '<tr><td colspan="5">空</td></tr>';
      } catch (e) {
        $('jobs').innerHTML = '<tr><td colspan="5">' + e.message + '</td></tr>';
      }

      try {
        const fo = await api('/api/v1/followers', { timeoutMs: 10000 });
        $('followers').innerHTML = (fo.items || []).length
          ? fo.items.map((x) => '<div class="tag" style="margin:.15rem">@' + x.username + (x.verified ? ' ✓' : '') + '</div>').join('')
          : '<span class="warn">无本地粉丝数据（若 402 则无法从 X 拉取列表）</span>';
      } catch (e) {
        $('followers').textContent = e.message;
      }

      try {
        const fi = await api('/api/v1/following', { timeoutMs: 10000 });
        $('following').innerHTML = (fi.items || []).length
          ? fi.items.map((x) => '<div class="tag" style="margin:.15rem">@' + x.username + (x.verified ? ' ✓' : '') + '</div>').join('')
          : '<span class="warn">无本地关注数据</span>';
      } catch (e) {
        $('following').textContent = e.message;
      }
    } catch (e) {
      log('refresh FAIL ' + e.message);
      toast('刷新失败: ' + e.message, 'err');
    } finally {
      refreshing = false;
    }
  }

  function connectWs() {
    if (ws) {
      try { ws.close(); } catch (_) {}
    }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/api/v1/ws';
    $('wsState').textContent = 'ws: connecting';
    try {
      ws = new WebSocket(url);
    } catch (e) {
      $('wsState').textContent = 'ws: err';
      return;
    }
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'auth', token: token }));
    };
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        $('wsState').textContent = 'ws: ok';
        if (msg.type === 'runtime.changed' && msg.payload && msg.payload.authenticated) {
          log('ws authenticated');
          return;
        }
        log(msg.type + ' ' + JSON.stringify(msg.payload || {}).slice(0, 160));
        if (['stats.updated', 'job.updated', 'runtime.changed', 'sync.progress', 'x.error'].includes(msg.type)) {
          refresh();
        }
      } catch (_) {}
    };
    ws.onclose = () => {
      $('wsState').textContent = 'ws: closed';
      if (token) setTimeout(connectWs, 3000);
    };
    ws.onerror = () => {
      $('wsState').textContent = 'ws: err';
    };
  }

  function bind(id, handler) {
    const el = $(id);
    if (!el) return;
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      handler();
    });
  }

  bind('btnLogin', () => withAction('登录', async () => {
    token = $('token').value.trim();
    if (!token) throw new Error('请输入 ADMIN_TOKEN');
    await api('/api/v1/me', { timeoutMs: 15000 });
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    await refresh();
    connectWs();
  }));

  bind('btnStart', () => withAction('启动自动化', async () => {
    await api('/api/v1/control/start', { method: 'POST', body: '{}' });
    await refresh();
  }));

  bind('btnStop', () => withAction('停止', async () => {
    await api('/api/v1/control/stop', { method: 'POST', body: '{}' });
    await refresh();
  }));

  bind('btnSync', () => withAction('请求同步', async () => {
    await api('/api/v1/control/sync', { method: 'POST', body: '{}' });
    await refresh();
  }));

  bind('btnProbe', () => withAction('探测 X API', async () => {
    const r = await api('/api/v1/control/probe', { method: 'POST', body: '{}', timeoutMs: 90000 });
    log('probe ' + JSON.stringify(r.capabilities || r).slice(0, 400));
    await refresh();
  }));

  bind('btnRefresh', () => withAction('刷新', async () => {
    await refresh();
  }));

  // Enter to login
  $('token').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('btnLogin').click();
  });

  // Light refresh every 8s (not 5) and skip if busy
  setInterval(() => {
    if (token && !busy && $('app').style.display !== 'none') refresh();
  }, 8000);
})();
</script>
</body>
</html>
