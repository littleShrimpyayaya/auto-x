services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-x-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5433:5432"  # 仅本地调试
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_x"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: auto-x-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auto_x
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      PORT: 3000
    volumes:
      - appdata:/app/data
    # 不暴露端口到宿主机，仅 nginx 通过 Docker 网络访问

  nginx:
    image: nginx:alpine
    container_name: auto-x-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 自签证书（CN/IP = 101.32.109.42）；路径来自仓库内 nginx/nginx/certs
      - ./nginx/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app

volumes:
  pgdata:
  appdata:
  nginx_logs:
