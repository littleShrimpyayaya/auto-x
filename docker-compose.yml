# auto-x main stack: postgres + one-shot migrate + api + worker
# nginx is intentionally NOT here — keep nginx/tools/ and start nginx separately if needed.
# Start: ./scripts/start.sh   or   make up

services:
  postgres:
    image: postgres:16-alpine
    container_name: autox-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - autox

  # K25: sole migrator — api/worker MUST NOT migrate on boot
  # PR1: packages/db migrate is a no-op stub that logs "PR1: no migrations yet" and exits 0
  # DATABASE_URL embeds POSTGRES_PASSWORD without URL-encoding — use URL-safe passwords
  # (no @ : / # ? % etc.) until an entrypoint encodes credentials (see .env.example).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: migrate
    container_name: autox-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autox}
    command: ["pnpm", "--filter", "@autox/db", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - autox

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: api
    container_name: autox-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autox}
      PORT: "3000"
      PG_POOL_MAX: "10"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autox

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: worker
    container_name: autox-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autox}
      WORKER_ID: worker-1
      PG_POOL_MAX: "10"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - autox

volumes:
  pgdata:

networks:
  autox:
    name: autox
    driver: bridge
