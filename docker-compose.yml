services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-x-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: auto-x-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auto_x
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3000

volumes:
  pgdata:
