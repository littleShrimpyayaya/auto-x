#load_module modules/ngx_http_modsecurity_module.so;

worker_processes  auto;
pid /tmp/nginx.pid;

events {
    use  epoll;
    worker_connections  1024;
}

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

    #----------------------------
    # 日志与性能
    #----------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"'
                      ' --> $request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log  error;
    #access_log  /dev/stdout  main;
    #error_log /dev/stderr error;
    client_max_body_size 100m;          # 限制最大请求体
    client_header_timeout 5m;
    client_body_timeout 50m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile        on;
    sendfile_max_chunk 2m;           # 限制单次sendfile传输大小，避免阻塞
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;              # 隐藏版本信息
    
    # 大文件传输优化
    output_buffers   2 32k;           # 输出缓冲区优化
    postpone_output  1460;            # 延迟输出直到有足够数据
    
    # 文件缓存优化
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    # WebSocket升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    #----------------------------
    # 全局安全头
    #----------------------------
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;
    # 修改CSP策略以支持Flutter Web、Google Fonts、OpenStreetMap、高德地图代理和WebSocket连接
    #add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com blob:; connect-src 'self' https: wss: ws: https://www.gstatic.com https://fonts.gstatic.com https://tile.openstreetmap.org https://nominatim.openstreetmap.org blob:; img-src 'self' data: blob: https: https://tile.openstreetmap.org; media-src 'self' blob: https:; font-src 'self' https://fonts.gstatic.com data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com blob:;" always;
    
    # 启用 ModSecurity
    #modsecurity off;

    #----------------------------
    # Gzip 压缩配置
    #----------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        application/x-web-app-manifest+json
        application/wasm
        application/octet-stream;
    
    # 对图片文件启用轻度压缩（主要针对SVG等文本格式图片）
    gzip_disable "msie6";
    
    # Brotli 压缩配置（如果支持）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    #----------------------------
    # 代理缓存配置
    #----------------------------
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=image_cache:10m max_size=1g inactive=30d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    resolver 127.0.0.11 valid=300s ipv6=off;
    
    #modsecurity_rules_file main.conf;

    # auto-x API (host-published port 3000 or compose service alias)
    upstream backend_api {
        server host.docker.internal:3000;
        keepalive 128;
    }

    server {
        listen 80;
        server_name localhost;

        # 健康检查专用（docker healthcheck / 探活），不 301 到 HTTPS
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  15m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        root /var/www/web;
        index index.html;

         # 仅允许常用方法
        if ($request_method !~ ^(PUT|GET|POST|HEAD|DELETE|PATCH|OPTIONS)$ ) {
            return 405;
        }

        # 所有前端路径都优先找真实文件，找不到就回落到 index.html
        # index.html 必须每次校验，否则用户会长期卡在旧入口脚本引用上
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Flutter 主包文件名固定（main.dart.js / .wasm），禁止 immutable 长缓存，
        # 否则修复后浏览器仍跑旧 bundle（控制台 stack 指向已不存在的行号）。
        location ~* ^/(main\.dart\.(js|mjs|wasm)|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
            add_header Vary "Accept-Encoding";
        }

        # 带内容哈希/相对稳定的静态资源可长缓存
        location ~* \.(?:css|js|mjs|json|map|wasm|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # 图标
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location /internal/real_path/ {
           internal;
           alias /data/files/;
        }
        
        # REST + WebSocket (/api/v1/ws) — Upgrade headers required
        location ^~ /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
