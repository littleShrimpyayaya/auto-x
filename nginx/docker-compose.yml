# Standalone nginx: 80 → 301 HTTPS, 443 static + /api reverse proxy + WebSocket.
# Prefer joining the main stack network so upstream is service name `api:3000`.
#
# From repo root:
#   docker compose -f nginx/docker-compose.yml up -d
# Or via scripts/start.sh (starts main stack then nginx).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: autox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/certs:/etc/nginx/certs:ro
      - ./web:/var/www/web:ro
      - ./logs:/var/log/nginx
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - autox
      - nginx_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Main auto-x stack (postgres/api/worker)
  autox:
    external: true
    name: autox
  nginx_net:
    driver: bridge
