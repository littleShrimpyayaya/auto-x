# Standalone nginx for static admin + reverse proxy to API (topology B).
# From this directory: docker compose up -d
# Requires API reachable at host.docker.internal:3000 (or change upstream).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: autox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/certs:/etc/nginx/certs:ro
      - ./web:/var/www/web:ro
      - ./logs:/var/log/nginx
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - nginx_net

networks:
  nginx_net:
    driver: bridge
