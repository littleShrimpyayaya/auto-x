<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>auto-x 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; font-size: 14px; background: #0f1419; color: #e7e9ea; padding: 24px; max-width: 420px; margin: 0 auto; }
    h1 { font-size: 22px; color: #1d9bf0; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #71767b; margin-bottom: 4px; text-transform: uppercase; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #333; border-radius: 6px; background: #1a1f26; color: #e7e9ea; font-size: 14px; }
    input:focus { outline: none; border-color: #1d9bf0; }
    .hint { font-size: 11px; color: #71767b; margin-top: 4px; }
    button { padding: 10px 20px; background: #1d9bf0; color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .status { margin-top: 12px; font-size: 13px; }
    .ok { color: #00ba7c; }
    .row { display: flex; align-items: center; gap: 8px; }
    .toggle { width: 44px; height: 24px; background: #333; border-radius: 12px; cursor: pointer; position: relative; }
    .toggle.on { background: #1d9bf0; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle.on::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <h1>auto-x 设置</h1>
  <div class="field">
    <label>自动回关</label>
    <div class="row">
      <div id="toggle-followBack" class="toggle on"></div>
      <span id="toggle-label">已启用</span>
    </div>
  </div>
  <div class="field">
    <label>最小间隔（秒）</label>
    <input type="number" id="minIntervalSec" min="30" max="600" value="60">
    <div class="hint">两次回关之间的最小间隔，建议 60 秒以上</div>
  </div>
  <div class="field">
    <label>每日最大回关数</label>
    <input type="number" id="maxFollowsPerDay" min="1" max="200" value="50">
  </div>
  <button id="btn-save">保存</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
