<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>auto-x 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #0f1419;
      color: #e7e9ea;
      padding: 24px;
      max-width: 440px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; color: #1d9bf0; margin-bottom: 8px; }
    .sub { color: #71767b; font-size: 12px; margin-bottom: 20px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: #71767b;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1f26;
      color: #e7e9ea;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #1d9bf0; }
    .hint { font-size: 11px; color: #71767b; margin-top: 4px; line-height: 1.4; }
    button {
      padding: 10px 20px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1a8cd8; }
    .status { margin-top: 12px; font-size: 13px; }
    .ok { color: #00ba7c; }
    .note {
      margin-top: 24px;
      padding: 12px;
      background: #1a1f26;
      border-radius: 8px;
      font-size: 12px;
      color: #71767b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>auto-x 设置</h1>
  <p class="sub">
    自动关注的「开始 / 停止」在弹窗里控制，关闭弹窗不会停止后台任务。
    这里只调整节奏与每日上限。
  </p>

  <div class="field">
    <label>最小间隔（秒）</label>
    <input type="number" id="minIntervalSec" min="30" max="600" value="60">
    <div class="hint">两次回关之间的最小间隔。建议 ≥ 60 秒，降低风控风险。</div>
  </div>

  <div class="field">
    <label>每日最大回关数</label>
    <input type="number" id="maxFollowsPerDay" min="1" max="200" value="50">
    <div class="hint">达到上限后自动停止当日回关，次日重置。</div>
  </div>

  <button id="btn-save">保存</button>
  <div id="status" class="status"></div>

  <div class="note">
    <b>跨浏览器：</b>支持 Chrome / Edge / Firefox / 其他 Chromium。<br>
    Chrome/Edge：开发者模式 → 加载已解压扩展。<br>
    Firefox：about:debugging → 临时载入附加组件 → 选 manifest.json。
  </div>

  <script src="../lib/browser.js"></script>
  <script src="options.js"></script>
</body>
</html>
