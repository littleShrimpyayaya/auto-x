<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-x 控制台</title>
  <link rel="stylesheet" href="../popup/popup.css">
</head>
<body class="panel-mode">
  <div id="app">
    <header>
      <div class="brand">
        <img src="../../icons/icon-48.png" alt="" class="logo" width="28" height="28">
        <h1>auto-x</h1>
      </div>
      <span id="status-dot" class="dot offline" title="状态"></span>
    </header>

    <section id="pin-tip" class="card pin-tip">
      <div class="pin-tip-row">
        <div>
          <div class="pin-tip-title">📌 本页可固定显示</div>
          <div class="hint pin-tip-body">
            你正在使用<strong>固定控制台</strong>：切换到 X 浏览时页面不会自动关闭。<br>
            · <b>侧边栏</b>：点工具栏图标即可打开（Chrome / Edge）<br>
            · <b>固定标签</b>：点下方按钮打开标签后，右键标签 →「固定标签页」
          </div>
        </div>
        <button id="btn-pin-dismiss" class="link-btn" type="button">知道了</button>
      </div>
    </section>

    <section id="panel-actions" class="card">
      <div class="label">页面固定方式</div>
      <div class="actions col">
        <button id="btn-open-side" class="btn primary" type="button">在侧边栏打开</button>
        <button id="btn-open-tab" class="btn" type="button">在新标签页打开（可固定标签）</button>
      </div>
      <div class="hint">侧边栏会停在浏览器一侧；标签页可用浏览器自带的「固定标签页」钉住。</div>
    </section>

    <section id="gate" class="card">
      <div class="label">连接状态</div>
      <div id="conn-badge" class="conn-badge checking" role="status">
        <span class="conn-badge-dot"></span>
        <span id="conn-badge-text">检测中…</span>
      </div>
      <div id="gate-status" class="gate-status">请稍候</div>
      <div id="gate-hint" class="hint"></div>
      <div id="gate-error" class="error-box hidden"></div>
      <div class="actions col" id="gate-actions">
        <button id="btn-login" class="btn primary hidden">登录 X 账户</button>
        <button id="btn-connect" class="btn primary hidden">连接账户</button>
        <button id="btn-open-x" class="btn hidden">打开 X.com</button>
      </div>
    </section>

    <section id="account" class="card hidden">
      <div class="label">当前账户</div>
      <div class="account-row">
        <img id="account-avatar" class="avatar hidden" alt="">
        <div class="account-meta">
          <div id="account-name" class="account-name">—</div>
          <div id="account-handle" class="account-handle">—</div>
        </div>
      </div>
      <div id="account-extra" class="hint"></div>
      <div class="account-footer">
        <button id="btn-disconnect" class="link-btn" title="解除与本插件的绑定（不会退出 X 登录）">
          解除绑定
        </button>
      </div>
    </section>

    <section id="sync" class="card hidden">
      <div class="label">图谱同步</div>
      <div id="sync-status">未同步</div>
      <div class="actions">
        <button id="btn-sync-followers" class="btn">同步粉丝</button>
        <button id="btn-sync-following" class="btn">同步关注</button>
      </div>
      <div class="hint">同步时会打开列表页并自动翻页；关闭本面板不影响后台自动关注。</div>
    </section>

    <section id="controls" class="card hidden">
      <div class="label">自动回关</div>
      <button id="btn-auto" class="btn primary btn-lg">开始自动关注</button>
      <div id="auto-hint" class="hint">后台运行，关闭面板不会停止。</div>
    </section>

    <section id="usage" class="card hidden">
      <div class="label">今日用量</div>
      <div id="usage-detail">—</div>
      <div id="pending-line" class="hint"></div>
    </section>

    <section id="results" class="card hidden">
      <div class="results-header">
        <div class="label">关注结果</div>
        <button id="btn-clear-results" class="btn btn-sm">清空</button>
      </div>
      <div class="stats-row">
        <div class="stat ok">
          <span class="stat-num" id="success-count">0</span>
          <span class="stat-label">成功</span>
        </div>
        <div class="stat fail">
          <span class="stat-num" id="fail-count">0</span>
          <span class="stat-label">失败</span>
        </div>
      </div>
      <div class="lists">
        <div class="list-block">
          <div class="list-title ok-text">成功名单</div>
          <ul id="success-list" class="user-list"></ul>
        </div>
        <div class="list-block">
          <div class="list-title fail-text">失败名单</div>
          <ul id="fail-list" class="user-list"></ul>
        </div>
      </div>
    </section>

    <footer>
      <a href="#" id="open-options">设置</a>
      <span id="version-info"></span>
    </footer>
  </div>
  <script src="../lib/browser.js"></script>
  <script src="../popup/popup.js"></script>
</body>
</html>
